name: Sync Repository Settings

on:
  schedule:
    # Every hour, on the hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Process only the given owner (empty for all targets)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (do not apply anything)'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        run: |
          gh --version

      - name: Run apply-settings
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          chmod +x ./apply-settings.sh

          # Build the arguments as an array (whitespace-safe)
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          if [ -n "${{ inputs.target }}" ]; then
            ARGS+=("--target" "${{ inputs.target }}")
          fi

          ./apply-settings.sh "${ARGS[@]}"
