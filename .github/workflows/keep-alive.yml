name: Keep Alive

# GitHub Actions automatically disables scheduled workflows after 60 days
# without repository activity. This workflow periodically calls the enable API
# for the target workflows, which keeps pushing the disable deadline back before
# it is reached (calling it on an already enabled workflow still extends the
# deadline).
# Reference (Japanese): https://gooner.hateblo.jp/entry/2025/02/27/163322
#
# This workflow targets itself as well, so as long as it keeps running it
# cannot fall into a disabled state it could not recover from.

on:
  schedule:
    # Runs on the 1st and 15th of every month at 09:00 JST (00:00 UTC)
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Keep Alive
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Enable the target workflows to extend the disable deadline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Workflow file names (the enable API accepts a file name in place of an ID)
          workflow_files=(
            "keep-alive.yml"
            "sync.yml"
          )

          for workflow_file in "${workflow_files[@]}"; do
            gh api --method PUT "repos/${{ github.repository }}/actions/workflows/${workflow_file}/enable"
            echo "Enabled workflow: ${workflow_file}"
          done
