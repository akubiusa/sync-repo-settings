name: PR Preview

on:
  pull_request_target:
    branches:
      - master

jobs:
  post-approval-request:
    runs-on: ubuntu-latest
    # Only fork PRs need an approval request; same-repository PRs run without approval
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      pull-requests: write
    steps:
      - name: Post approval request comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Waiting for Environment approval

            Running the dry-run for this PR requires approval of the `pr-preview` Environment.

            [Review the Actions run and approve it](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.pull_request.number }})

  preview:
    runs-on: ubuntu-latest
    needs: post-approval-request
    # The comment job is skipped for same-repository PRs; run anyway unless it failed or the run was cancelled
    if: ${{ !cancelled() && (needs.post-approval-request.result == 'success' || needs.post-approval-request.result == 'skipped') }}
    # Only PRs from forks need approval through the 'pr-preview' Environment
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'pr-preview' || '' }}
    permissions:
      contents: read
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          # For pull_request_target, check out the PR HEAD
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          # actions/checkout refuses to check out a fork PR's HEAD SHA by default,
          # so allow it explicitly only for fork PRs approved through the 'pr-preview' Environment
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}
          # Do not persist credentials when checking out fork PRs (untrusted code)
          persist-credentials: ${{ !(github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) }}

      - name: Run dry-run
        id: dry-run
        continue-on-error: true
        env:
          # Note: GITHUB_TOKEN can only access a single repository, so it cannot be
          # used by apply-settings.sh, which reads settings of many repositories.
          # PERSONAL_ACCESS_TOKEN is required.
          # With pull_request_target the PAT is also available to fork PRs; the only
          # gate is the Environment approval. The empty-PAT check below only guards
          # against a missing secret.
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          chmod +x ./apply-settings.sh

          # Error when the PAT is empty (should not normally happen)
          if [ -z "$GH_TOKEN" ]; then
            echo "## PERSONAL_ACCESS_TOKEN is not set" > summary.txt
            echo "" >> summary.txt
            echo "Set PERSONAL_ACCESS_TOKEN in the repository secrets." >> summary.txt
            echo "" > details.txt
            exit 1
          fi

          # Run the dry-run (stdout: Markdown summary, stderr: detailed log)
          set +e +o pipefail
          ./apply-settings.sh --dry-run --markdown > summary.txt 2> details.txt
          exit_code=$?
          set -eo pipefail

          if [ $exit_code -ne 0 ]; then
            echo "## An error occurred" > summary.txt
            echo "" >> summary.txt
            echo "Exit code: $exit_code" >> summary.txt
          fi

      - name: Ensure result files exist
        if: always()
        run: |
          touch summary.txt details.txt

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-preview-results
          path: |
            summary.txt
            details.txt
          retention-days: 1

      - name: Save PR number
        if: always()
        run: echo ${{ github.event.pull_request.number }} > pr_number.txt

      - name: Upload PR number
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-number
          path: pr_number.txt
          retention-days: 1
